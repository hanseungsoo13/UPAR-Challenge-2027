# Reference defaults. The CLI is authoritative; every uncertain paper setting is configurable.
task: task2
model: attrivision
clip_model: ViT-B-32-quickgelu
pretrained_tag: openai
image_size: 224
epochs: 100
batch_size: 128
eval_batch_size: 128
learning_rate: 1.0e-5
weight_decay: 0.01
text_sampling: single
multi_attributes: 3
prompt_mode: category_complete
loss: focal_clip
training_objective: task2_hybrid
prototype_loss_weight: 0.25
set_loss_weight: 1.0
balance_max_weight: 10.0
focal_alpha: 1.0
focal_gamma: 2.0
contrastive_target: diagonal
unique_prompts: false
query_aggregation: mean
rotation: 10.0
warmup_epochs: 5
min_learning_rate: 1.0e-7
minimum_training_epochs: 50
early_stopping_patience: 20
